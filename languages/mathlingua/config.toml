name = "Mathlingua"
grammar = "mathlingua"
path_suffixes = ["mlg"]
line_comments = ["-- "]
autoclose_before = ";:.,=}])>"
brackets = [
  { start = "{", end = "}", close = true, newline = true },
  { start = "[", end = "]", close = true, newline = true },
  { start = "(", end = ")", close = true, newline = true },
  { start = "\"", end = "\"", close = true, newline = false, not_in = ["string"] },
]
tab_size = 2
